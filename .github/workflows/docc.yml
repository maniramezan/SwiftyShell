name: Build DocC

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate authored DocC coverage
        run: swift Scripts/validate-docc-coverage.swift

      - name: Build DocC
        run: |
          swift package --allow-writing-to-directory docs \
            generate-documentation \
            --target SwiftyShell \
            --output-path docs \
            --transform-for-static-hosting \
            --hosting-base-path SwiftyShell

      - name: Add root redirect
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="color-scheme" content="light dark">
            <meta http-equiv="refresh" content="0; url=/SwiftyShell/documentation/swiftyshell/">
            <link rel="canonical" href="/SwiftyShell/documentation/swiftyshell/">
            <title>SwiftyShell Documentation</title>
            <style>
              :root {
                color-scheme: light dark;
              }

              body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 2rem;
                font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: Canvas;
                color: CanvasText;
              }

              a {
                color: LinkText;
              }
            </style>
          </head>
          <body>
            <p>Redirecting to <a href="/SwiftyShell/documentation/swiftyshell/">documentation</a>…</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
