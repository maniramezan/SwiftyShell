name: Build DocC

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Build DocC
        run: |
          swift package --allow-writing-to-directory docs \
            generate-documentation \
            --target SwiftyShell \
            --output-path docs \
            --transform-for-static-hosting \
            --hosting-base-path swiftyshell

      - name: Add root redirect
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=/swiftyshell/documentation/swiftyshell/">
            <link rel="canonical" href="/swiftyshell/documentation/swiftyshell/">
            <title>SwiftyShell Documentation</title>
          </head>
          <body>
            <p>Redirecting to <a href="/swiftyshell/documentation/swiftyshell/">documentation</a>…</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
