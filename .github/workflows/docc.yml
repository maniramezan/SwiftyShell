name: Main CI and DocC Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      deploy_pages: true
