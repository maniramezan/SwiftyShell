name: Bug Report
description: Report a reproducible SwiftyShell bug
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SwiftyShell. If this is a security issue, please do not file it publicly. See SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest code sample or command sequence that reproduces the issue.
      render: swift
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect SwiftyShell to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead? Include output or errors if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SwiftyShell Version
      placeholder: 0.1.0-beta.1 or commit SHA
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift Version
      placeholder: swift --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.0, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that may help debug the issue.
