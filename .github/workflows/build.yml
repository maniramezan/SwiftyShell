name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-traits:
    name: Validate Trait Wiring
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Validate trait wiring
        run: swift Scripts/validate-traits.swift

  lint:
    name: swift-format lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: swift-format lint --strict
        run: swift-format lint --strict --recursive Sources Tests Scripts

  build-macos:
    name: macOS (traits=${{ matrix.traits }})
    needs: [validate-traits, lint]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # "" exercises the new opt-in default (Core only). Per-family entries
        # ensure every family compiles and tests in isolation. "All" covers
        # the full public surface previously verified by the unflagged build.
        traits: ["", "Git", "Brew", "Grep", "CommonUtilities", "All"]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Resolve trait flag
        id: flag
        run: |
          if [ -z "${{ matrix.traits }}" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--traits ${{ matrix.traits }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: swift build -c release ${{ steps.flag.outputs.args }}

      - name: Test
        run: swift test ${{ steps.flag.outputs.args }}

  build-linux:
    name: Linux (traits=${{ matrix.traits }})
    needs: [validate-traits, lint]
    runs-on: ubuntu-latest
    container:
      image: swift:6.1
    strategy:
      fail-fast: false
      matrix:
        traits: ["", "Git", "Brew", "Grep", "CommonUtilities", "All"]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Resolve trait flag
        id: flag
        run: |
          if [ -z "${{ matrix.traits }}" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--traits ${{ matrix.traits }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: swift build -c release ${{ steps.flag.outputs.args }}

      - name: Test
        run: swift test ${{ steps.flag.outputs.args }}
