name: Pull Request Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Compute which traits are affected by the changed files so the reusable CI
  # workflow runs only the relevant build/test matrix entries.
  detect-traits:
    name: Detect Affected Traits
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute affected traits
        id: compute
        run: |
          FULL='["", "Git", "Brew", "Grep", "Fzf", "Rg", "Swift", "Cargo", "Gh", "Docker", "Make", "Node", "Npm", "Yarn", "Pnpm", "Bun", "Terraform", "Kubectl", "Helm", "Python", "Curl", "Ls", "Cp", "Mkdir", "Chmod", "Rm", "Mv", "Pwd", "Jq", "Rsync", "Tar", "Zip", "Unzip", "Ln", "Touch", "Env", "Which", "Find", "CommonUtilities", "All"]'

          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          # Changes to Core, Internal, Package.swift, CI workflows, or the
          # ungated shared test helper affect every trait build.
          if echo "$CHANGED" | grep -qE '^(Package\.swift$|Package\.resolved$|\.github/workflows/|Scripts/validate-(code-coverage|traits)\.swift$|Sources/SwiftyShell/Core/|Sources/SwiftyShell/Internal/|Tests/SwiftyShellTests/Common/CommonTestSupport\.swift$)'; then
            echo "Full matrix required (core/package/CI workflow change detected)"
            echo "matrix=$FULL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          traits=()

          # Core-only build ("") is needed only when ungated test files change.
          echo "$CHANGED" | grep -qE '^Tests/SwiftyShellTests/(Core/|Pipelines/)' && traits+=("")

          # Per-family builds — only when that family's sources or tests changed.
          family_traits=()
          common_changed=false
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Git/|Tests/SwiftyShellTests/Git/)' && family_traits+=("Git")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Brew/|Tests/SwiftyShellTests/Brew/)' && family_traits+=("Brew")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Grep/|Tests/SwiftyShellTests/Grep/)' && family_traits+=("Grep")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Fzf/|Tests/SwiftyShellTests/Fzf/)' && family_traits+=("Fzf")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Rg/|Tests/SwiftyShellTests/Rg/)' && family_traits+=("Rg")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Swift/|Tests/SwiftyShellTests/Swift/)' && family_traits+=("Swift")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Cargo/|Tests/SwiftyShellTests/Cargo/)' && family_traits+=("Cargo")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Gh/|Tests/SwiftyShellTests/Gh/)' && family_traits+=("Gh")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Docker/|Tests/SwiftyShellTests/Docker/)' && family_traits+=("Docker")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Make/|Tests/SwiftyShellTests/Make/)' && family_traits+=("Make")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Node/|Tests/SwiftyShellTests/Node/)' && family_traits+=("Node")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Npm/|Tests/SwiftyShellTests/Npm/)' && family_traits+=("Npm")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Yarn/|Tests/SwiftyShellTests/Yarn/)' && family_traits+=("Yarn")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Pnpm/|Tests/SwiftyShellTests/Pnpm/)' && family_traits+=("Pnpm")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Bun/|Tests/SwiftyShellTests/Bun/)' && family_traits+=("Bun")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Terraform/|Tests/SwiftyShellTests/Terraform/)' && family_traits+=("Terraform")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Kubectl/|Tests/SwiftyShellTests/Kubectl/)' && family_traits+=("Kubectl")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Helm/|Tests/SwiftyShellTests/Helm/)' && family_traits+=("Helm")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Python/|Tests/SwiftyShellTests/Python/)' && family_traits+=("Python")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Curl/|Tests/SwiftyShellTests/Curl/)' && family_traits+=("Curl")
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Ls\.swift|Tests/SwiftyShellTests/Common/LsTests\.swift)$' && family_traits+=("Ls") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Cp\.swift|Tests/SwiftyShellTests/Common/CpTests\.swift)$' && family_traits+=("Cp") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Mkdir\.swift|Tests/SwiftyShellTests/Common/MkdirTests\.swift)$' && family_traits+=("Mkdir") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Chmod\.swift|Tests/SwiftyShellTests/Common/ChmodTests\.swift)$' && family_traits+=("Chmod") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Rm\.swift|Tests/SwiftyShellTests/Common/RmTests\.swift)$' && family_traits+=("Rm") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Mv\.swift|Tests/SwiftyShellTests/Common/MvTests\.swift)$' && family_traits+=("Mv") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Pwd\.swift|Tests/SwiftyShellTests/Common/PwdTests\.swift)$' && family_traits+=("Pwd") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Jq\.swift|Tests/SwiftyShellTests/Common/JqTests\.swift)$' && family_traits+=("Jq") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Rsync\.swift|Tests/SwiftyShellTests/Common/RsyncTests\.swift)$' && family_traits+=("Rsync") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Tar\.swift|Tests/SwiftyShellTests/Common/TarTests\.swift)$' && family_traits+=("Tar") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Zip\.swift|Tests/SwiftyShellTests/Common/(ZipTests|ZipUnzipTests)\.swift)$' && family_traits+=("Zip") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Unzip\.swift|Tests/SwiftyShellTests/Common/(UnzipTests|ZipUnzipTests)\.swift)$' && family_traits+=("Unzip") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Ln\.swift|Tests/SwiftyShellTests/Common/LnTests\.swift)$' && family_traits+=("Ln") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Touch\.swift|Tests/SwiftyShellTests/Common/TouchTests\.swift)$' && family_traits+=("Touch") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Env\.swift|Tests/SwiftyShellTests/Common/EnvTests\.swift)$' && family_traits+=("Env") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Which\.swift|Tests/SwiftyShellTests/Common/WhichTests\.swift)$' && family_traits+=("Which") && common_changed=true
          echo "$CHANGED" | grep -qE '^(Sources/SwiftyShell/Common/Find\.swift|Tests/SwiftyShellTests/Common/FindTests\.swift)$' && family_traits+=("Find") && common_changed=true
          [ "$common_changed" = true ] && family_traits+=("CommonUtilities")
          traits+=("${family_traits[@]}")

          # "All" umbrella whenever any family changed.
          [ ${#family_traits[@]} -gt 0 ] && traits+=("All")

          # Nothing source-relevant changed — skip all builds.
          if [ ${#traits[@]} -eq 0 ]; then
            echo "No source changes detected — skipping builds."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Serialize to a JSON array.
          json="["
          for i in "${!traits[@]}"; do
            [[ $i -gt 0 ]] && json+=","
            json+="\"${traits[$i]}\""
          done
          json+="]"

          echo "Affected traits: $json"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  ci:
    needs: detect-traits
    uses: ./.github/workflows/reusable-ci.yml
    with:
      enforce_coverage: true
      minimum_line_coverage: "84"
      trait_matrix: ${{ needs.detect-traits.outputs.matrix }}
